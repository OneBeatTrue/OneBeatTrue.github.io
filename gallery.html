<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="автомастерская, электромобили, ремонт электромобилей">
    <meta name="description" content="Автомастерская электромобилей.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARe</title>
    <link href="css/index.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" sizes="96x96" href="img/favicon.ico">
    <script src="js/header.js" defer></script>
    <script src="js/index.js" defer></script>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
</head>
<body>
<header class="header"></header>
<main class="main">
    <section class="section section_titled-gallery" id="gallery">
        <h2 class="section__title">Наши работы</h2>
        <div class="swiper-container">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="img/car1.png" alt="Small car"></div>
                <div class="swiper-slide"><img src="img/car2.png" alt="Tesla Model S"></div>
                <div class="swiper-slide"><img src="img/car3.png" alt="Tesla Cybertruck"></div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
        <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
        <script src="js/swiper.js"></script>
    </section>
</main>
<footer class="footer">
    <p class="footer__text">г. Санкт-Петербург, Вяземский п-к, д. 5-7</p>
    <p class="footer__text">&copy; 2024 Электро-автомастерская CARe</p>
</footer>
</body>
</html>
