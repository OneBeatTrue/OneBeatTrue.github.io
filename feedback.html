<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="автомастерская, электромобили, ремонт электромобилей">
    <meta name="description" content="Автомастерская электромобилей.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARe</title>
    <link href="css/index.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" sizes="96x96" href="img/favicon.ico">
    <script src="js/header.js" defer></script>
    <script src="js/index.js" defer></script>
    <script src="js/feedback.js" defer></script>
</head>
<body>
<header class="header"></header>
<main class="main">
  <section class="section section_titled-form">
    <h2 class="section__title">Оставить отзыв</h2>
      <form class="feedback-form" id="feedbackForm">
        <label for="name"></label>
        <input type="text" id="name" name="name" placeholder="Имя" required>
        <label for="feedback"></label>
        <input type="text" id="feedback" name="feedback" placeholder="Отзыв" required>
        <button type="submit">Оставить отзыв</button>
      </form>
  </section>
  <section class="section section_titled-feedback">
    <h2 class="section__title">Отзывы</h2>
      <div class="feedback-container" id="feedbackContainer"></div>
  </section>
</main>
<footer class="footer">
    <p class="footer__text">г. Санкт-Петербург, Вяземский п-к, д. 5-7</p>
    <p class="footer__text">&copy; 2024 Электро-автомастерская CARe</p>
</footer>
</body>
</html>
